<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Catálogo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>TechStore</h1>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="registro.html">Registro</a></li>
            <li><a href="quienes-somos.html">Quiénes somos</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="carrito.html">Carrito (<span id="contador-carrito">0</span>)</a></li>
            <li><a href="busqueda.html">Buscar productos</a></li>
        </ul>
    </nav>
</header>

<main>

    <h2>Catálogo de productos</h2>

    <section class="productos">

        <article class="producto">
            <img src="imgs/laptop.svg" alt="Laptop">
            <h3>Laptop Pro</h3>
            <p>$15,999.00</p>
            <button class="agregar-carrito">Agregar al carrito</button>
        </article>

        <article class="producto">
            <img src="imgs/audifonos.svg" alt="Audífonos">
            <h3>Audífonos Bluetooth</h3>
            <p>$899.00</p>
            <button class="agregar-carrito">Agregar al carrito</button>
        </article>

        <article class="producto">
            <img src="imgs/teclado.svg" alt="Teclado">
            <h3>Teclado Mecánico</h3>
            <p>$1,299.00</p>
            <button class="agregar-carrito">Agregar al carrito</button>
        </article>

        <article class="producto">
            <img src="imgs/mouse.svg" alt="Mouse">
            <h3>Mouse Gamer</h3>
            <p>$599.00</p>
            <button class="agregar-carrito">Agregar al carrito</button>
        </article>

    </section>

</main>

<footer>
    <p>© 2026 TechStore</p>
</footer>

<script src="script.js"></script>

</body>
</html>
